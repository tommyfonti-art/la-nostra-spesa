<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<title>La nostra spesa</title>
<link rel="apple-touch-icon" href="icon.png?v=2">
<link rel="icon" href="icon.png?v=2">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="La spesa">
<meta name="theme-color" content="#C42B28">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600&family=Nunito:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  --bg:#EDF3F0; --surface:#FBFDFC; --surface-2:#E1ECE7; --ink:#27393B; --ink-soft:#5B7074; --line:#D0DED8;
  --accent:#8CC0AD; --accent-ink:#1B3830;
  --coop:#F5CDCD; --coop-ink:#6B3434;
  --tigota:#D6D3F4; --tigota-ink:#3F3870;
  --lidl:#F8E8B4; --lidl-ink:#66571A;
  --warn-bg:#F3CFCF; --warn-ink:#6B2E2E;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#1B2626; --surface:#243231; --surface-2:#2E3F3D; --ink:#E4EEEA; --ink-soft:#9DB3AE; --line:#384B4A;
    --accent:#62A18B; --accent-ink:#0E211B;
    --coop:#5A3A3D; --coop-ink:#F5CDCD;
    --tigota:#403D66; --tigota-ink:#D6D3F4;
    --lidl:#5A5028; --lidl-ink:#F8E8B4;
    --warn-bg:#6A3A3A; --warn-ink:#F7D6D6;
  }
}
:root[data-theme="dark"]{
  --bg:#1B2626; --surface:#243231; --surface-2:#2E3F3D; --ink:#E4EEEA; --ink-soft:#9DB3AE; --line:#384B4A;
  --accent:#62A18B; --accent-ink:#0E211B;
  --coop:#5A3A3D; --coop-ink:#F5CDCD;
  --tigota:#403D66; --tigota-ink:#D6D3F4;
  --lidl:#5A5028; --lidl-ink:#F8E8B4;
  --warn-bg:#6A3A3A; --warn-ink:#F7D6D6;
}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 Nunito,ui-rounded,"Avenir Next Rounded","Segoe UI",system-ui,sans-serif;-webkit-tap-highlight-color:transparent}
h1,h2,.num{font-family:Fredoka,ui-rounded,"Avenir Next Rounded",system-ui,sans-serif;font-weight:600}
main{max-width:560px;margin:0 auto;padding:20px 16px 210px}
.top{display:flex;flex-direction:column;gap:8px;margin-bottom:18px}
h1{font-size:30px;margin:0;line-height:1.1}
.sync{display:inline-flex;align-items:center;gap:8px;font-size:14px;color:var(--ink-soft)}
.dot{width:10px;height:10px;border-radius:50%;background:var(--accent);flex:none}
.sync.warn .dot{background:#E2B36B}
.stack{display:flex;flex-direction:column;gap:16px}

.card{background:var(--surface);border:1.5px solid var(--line);border-radius:28px;padding:8px}
.card-h{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 16px;margin-bottom:4px;border-radius:20px;background:var(--st,var(--surface-2));color:var(--st-ink,var(--ink))}
.card-h h2{margin:0;font-size:19px}
.meta{font-size:14px;font-weight:600;display:flex;gap:10px;align-items:baseline}
.meta b{font-weight:700}
.st-coop{--st:var(--coop);--st-ink:var(--coop-ink)}
.st-tigota{--st:var(--tigota);--st-ink:var(--tigota-ink)}
.st-lidl{--st:var(--lidl);--st-ink:var(--lidl-ink)}

.row{display:flex;align-items:center;gap:10px;padding:8px 8px 8px 8px;min-height:56px}
.row+.row{border-top:1.5px solid var(--line)}
.nome{flex:1;min-width:0;overflow-wrap:anywhere;font-weight:600}
.row.done .nome{color:var(--ink-soft);text-decoration:line-through;text-decoration-thickness:2px;text-decoration-color:var(--st-ink)}
.check{flex:none;width:36px;height:36px;border-radius:50%;border:2.5px solid var(--st-ink);background:transparent;color:transparent;display:grid;place-items:center;padding:0;cursor:pointer;transition:background .15s}
.check[aria-pressed="true"]{background:var(--st);color:var(--st-ink)}
.prezzo{flex:none;display:flex;align-items:center;gap:4px;width:108px;height:42px;padding:0 12px;border-radius:16px;background:var(--surface-2);font-weight:700}
.prezzo span{color:var(--ink-soft)}
.prezzo input{width:100%;min-width:0;border:0;background:transparent;font:inherit;font-size:16px;font-weight:700;color:var(--ink);text-align:right;outline:0}
.prezzo:focus-within{outline:3px solid var(--st-ink);outline-offset:1px}

.pick{flex:1;min-width:0;display:flex;align-items:center;justify-content:space-between;gap:10px;border:0;background:transparent;font:inherit;color:var(--ink);text-align:left;padding:8px 4px;cursor:pointer}
.stato{flex:none;display:inline-flex;align-items:center;gap:6px;font-size:14px;font-weight:700;padding:6px 14px;border-radius:999px;border:2px solid var(--line);color:var(--ink-soft)}
.row.on .stato{background:var(--st);color:var(--st-ink);border-color:transparent}
.trash{flex:none;min-width:42px;height:42px;border-radius:999px;border:0;background:transparent;color:var(--ink-soft);display:grid;place-items:center;padding:0 10px;font:inherit;font-weight:700;font-size:14px;cursor:pointer}
.trash.sure{background:var(--warn-bg);color:var(--warn-ink)}

.aggiungi{display:flex;flex-direction:column;gap:14px;padding:18px}
.aggiungi h2{margin:0;font-size:19px}
.campo{width:100%;border:2px solid var(--line);background:var(--bg);color:var(--ink);border-radius:18px;padding:13px 16px;font:inherit;font-size:16px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:2px solid transparent;background:var(--st);color:var(--st-ink);border-radius:999px;padding:9px 18px;font:inherit;font-weight:700;opacity:.55;cursor:pointer}
.chip.on{opacity:1;border-color:var(--st-ink)}
.btn{border:0;background:var(--accent);color:var(--accent-ink);font:inherit;font-weight:700;border-radius:999px;padding:14px 22px;cursor:pointer}
.btn.soft{background:var(--surface-2);color:var(--ink)}
.btn.sm{padding:10px 18px}
textarea.campo{resize:vertical;min-height:120px;line-height:1.45}
.row.edit{flex-wrap:wrap;padding:10px 8px}
.row.edit .campo{flex:1 1 100%}
.hint{margin:0;font-size:14px;color:var(--ink-soft)}
.cat-sub{padding:10px 8px 2px;font-size:13px;font-weight:700;text-transform:uppercase;letter-spacing:.02em;color:var(--ink-soft)}
.trash.edit{min-width:42px}
.btn-row{display:flex;gap:10px;flex-wrap:wrap}
:disabled{opacity:.5;cursor:not-allowed}
:focus-visible{outline:3px solid var(--ink);outline-offset:2px}

.vuoto{background:var(--surface);border:2px dashed var(--line);border-radius:28px;padding:30px 22px;text-align:center;display:flex;flex-direction:column;gap:12px;align-items:center}
.vuoto p{margin:0;color:var(--ink-soft)}
.vuoto .titolo{font-family:Fredoka,ui-rounded,system-ui,sans-serif;font-size:20px;font-weight:600;color:var(--ink)}
.fine{display:flex;flex-direction:column;gap:10px;padding:6px 4px}
.fine p{margin:0;color:var(--ink-soft);font-size:14px}

.dock{position:fixed;left:0;right:0;bottom:0;max-width:560px;margin:0 auto;padding:10px 14px calc(12px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:10px;pointer-events:none}
.dock>*{pointer-events:auto}
.totale{display:flex;align-items:center;justify-content:space-between;gap:12px;background:var(--accent);color:var(--accent-ink);border-radius:26px;padding:12px 22px}
.t-label{font-weight:700}
.t-sub{font-size:14px;opacity:.85}
.totale .num{font-size:30px;line-height:1}
.tabs{display:grid;grid-template-columns:1fr 1fr;gap:6px;background:var(--surface);border:1.5px solid var(--line);border-radius:999px;padding:5px}
.tab{border:0;background:transparent;color:var(--ink-soft);font:inherit;font-weight:700;border-radius:999px;padding:12px;cursor:pointer;transition:background .15s}
.tab[aria-selected="true"]{background:var(--surface-2);color:var(--ink)}

.toast{position:fixed;left:50%;transform:translateX(-50%);top:calc(12px + env(safe-area-inset-top,0px));z-index:10;max-width:calc(100% - 32px);background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:999px;font-weight:700;font-size:14px;text-align:center}
.toast[hidden]{display:none}
@media (prefers-reduced-motion: reduce){*{transition:none!important}}
</style>
</head>

<main id="app" aria-live="off"></main>
<div class="dock" id="dock"></div>
<div class="toast" id="toast" role="status" aria-live="polite" hidden></div>

<script>
/* ====== INCOLLA QUI LA TUA CONFIGURAZIONE FIREBASE ======
   La trovi in: Console Firebase → icona ingranaggio → Impostazioni progetto
   → scorri fino a "Le tue app" → app web → "Configurazione SDK".
   Sostituisci l'intero oggetto qui sotto col tuo, poi salva il file. */
var firebaseConfig = {
  apiKey: "AIzaSyBf_L7I710y1uCfqexrRS2A7fa1AIeQdPM",
  authDomain: "spesa-b6ed3.firebaseapp.com",
  projectId: "spesa-b6ed3",
  storageBucket: "spesa-b6ed3.firebasestorage.app",
  messagingSenderId: "85578996832",
  appId: "1:85578996832:web:97e9f2926410e13cda3705"
};
/* ========================================================= */
(function(){
  var NEGOZI = ['Coop','Tigotà','Lidl'];
  var CLS = {'Coop':'st-coop','Tigotà':'st-tigota','Lidl':'st-lidl'};
  var app = document.getElementById('app');
  var dock = document.getElementById('dock');
  var NS = 'http://www.w3.org/2000/svg';

  var items = [];
  var tab = 'spesa';
  var status = 'connessione';
  var loaded = false;
  var local = false;
  var writable = true;
  var draft = '';
  var sel = new Set(['Coop']);
  var confDel = null;
  var confermaFine = false;
  var refocusName = false;
  var refocusRename = false;
  var editId = null;
  var editDraft = '';
  var bulkDraft = '';
  var importing = false;
  var confSvuota = 0;
  var svuotando = false;
  var ordinaCategoria = false;
  var dirty = false;
  var PROJECT_ID = '';
  var API_KEY = '';
  var API_BASE = '';
  var pollTimer = null;
  var queues = {};
  var toastTimer;

  var eur = new Intl.NumberFormat('it-IT', {style:'currency', currency:'EUR'});
  function fmt(n){ return eur.format(n || 0); }
  function sum(list){ return list.reduce(function(s,i){ return s + (i.prezzo || 0); }, 0); }
  function byNome(a,b){ return a.nome.localeCompare(b.nome, 'it', {sensitivity:'base'}); }

  /* ---------- categorie automatiche (per l'ordinamento in Archivio) ---------- */
  var CATEGORIE = [
    {nome:'Carne e pesce', chiavi:['carne','pollo','manzo','maiale','tacchino','salsiccia','salsicce','salame','prosciutto','salumi','pesce','tonno','salmone','gamberi','alici','bresaola','wurstel','hamburger','polpette']},
    {nome:'Latticini e uova', chiavi:['latte','yogurt','formaggio','mozzarella','mozilla','parmigiano','grana','burro','panna','uova','uovo','ricotta','stracchino','philadelphia','sottilette']},
    {nome:'Pane e colazione', chiavi:['pane','fette biscottate','cereali','biscotti','marmellata','miele','caffè','caffe','tè','the','cornetti','brioche','cracker','grissini','taralli','tarallini','piadine','fiocchi avena']},
    {nome:'Pasta riso e dispensa', chiavi:['pasta','riso','farina','zucchero','sale','olio','aceto','legumi','fagioli','lenticchie','ceci','farro','orzo','passata','pelati','mais','olive','capperi','lievito','dado','brodo','semi']},
    {nome:'Dolci e snack', chiavi:['dolci','dolcetti','cioccolato','gelato','merendine','patatine','snack','caramelle','nutella']},
    {nome:'Bevande', chiavi:['acqua','vino','birra','succo','bibita','coca cola','aranciata']},
    {nome:'Pulizia casa', chiavi:['detersivo','detersivi','det.','ammorbidente','brillantante','candeggina','sgrassatore','scottex','carta igienica','sacchetti','spugna','wc gel','coccolino','mistermuscolo','bioform','profumo asciugatrice','pellicola','stagnola']},
    {nome:'Igiene personale', chiavi:['shampoo','bagnoschiuma','dentifricio','spazzolino','deodorante','cottonfioc','cotton fioc','assorbenti','sapone','acetone','delicata']},
    {nome:'Frutta e verdura', chiavi:['frutta','mela','mele','banana','pera','pere','arancia','arance','limone','limoni','uva','pesca','pesche','fragola','fragole','melone','anguria','kiwi','ananas','verdura','insalata','pomodoro','pomodorini','zucchina','zucchine','melanzana','melanzane','peperone','peperoni','carota','carote','cipolla','cipolle','patata','patate','aglio','sedano','cavolo','broccolo','broccoli','spinaci','funghi','scalogno','cetriolo','cetrioli','rucola','basilico','prezzemolo','mandarino','mandarini']}
  ];
  var ORDINE_CATEGORIE = CATEGORIE.map(function(c){ return c.nome; }).concat(['Altro']);
  // "Frutta e verdura" è messa per ultima apposta: se un prodotto contiene sia una
  // parola di frutta/verdura sia una parola più specifica di un'altra categoria
  // (es. "Aceto di mele" → aceto + mele), vince la categoria più specifica.
  // Il confronto è per parola intera, non per sottostringa: "Acetone" non deve
  // finire tra i condimenti solo perché contiene le lettere di "Aceto".
  function paroleIntere(testo, chiave){
    if (chiave.indexOf(' ') !== -1 || chiave.indexOf('.') !== -1){
      return testo.indexOf(chiave) !== -1;
    }
    var esc = chiave.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
    var re = new RegExp('(^|[^a-zàèéìòù])' + esc + '([^a-zàèéìòù]|$)', 'i');
    return re.test(testo);
  }
  function categoria(nome){
    var n = (nome || '').toLowerCase();
    for (var i = 0; i < CATEGORIE.length; i++){
      var c = CATEGORIE[i];
      for (var j = 0; j < c.chiavi.length; j++){
        if (paroleIntere(n, c.chiavi[j])) return c.nome;
      }
    }
    return 'Altro';
  }
  function byCategoria(a, b){
    var ca = ORDINE_CATEGORIE.indexOf(categoria(a.nome));
    var cb = ORDINE_CATEGORIE.indexOf(categoria(b.nome));
    if (ca !== cb) return ca - cb;
    return byNome(a, b);
  }

  function h(tag, props){
    var el = document.createElement(tag);
    var p = props || {};
    Object.keys(p).forEach(function(k){
      var v = p[k];
      if (v === null || v === undefined || v === false) return;
      if (k === 'class') el.className = v;
      else if (k === 'value') el.value = v;
      else if (k.slice(0,2) === 'on') el.addEventListener(k.slice(2), v);
      else el.setAttribute(k, v === true ? '' : v);
    });
    var kids = Array.prototype.slice.call(arguments, 2).flat(Infinity);
    kids.forEach(function(c){
      if (c === null || c === undefined || c === false) return;
      el.append(c.nodeType ? c : document.createTextNode(String(c)));
    });
    return el;
  }
  function svg(d){
    var s = document.createElementNS(NS, 'svg');
    s.setAttribute('viewBox','0 0 24 24'); s.setAttribute('width','18'); s.setAttribute('height','18');
    s.setAttribute('fill','none'); s.setAttribute('stroke','currentColor'); s.setAttribute('stroke-width','2.6');
    s.setAttribute('stroke-linecap','round'); s.setAttribute('stroke-linejoin','round'); s.setAttribute('aria-hidden','true');
    var p = document.createElementNS(NS, 'path'); p.setAttribute('d', d); s.append(p);
    return s;
  }
  var ICON_CHECK = 'M5 12.5l4.5 4.5L19 7.5';
  var ICON_EDIT = 'M4 20h4L19 9l-4-4L4 16v4zM13.5 6.5l4 4';
  var ICON_TRASH = 'M4 7h16M9 7V4h6v3M6.5 7l1 13h9l1-13';

  function toast(msg){
    var t = document.getElementById('toast');
    t.textContent = msg; t.hidden = false;
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function(){ t.hidden = true; }, 3400);
  }

  /* ---------- Firestore via chiamate REST semplici (niente SDK, niente canale streaming) ---------- */
  function genId(){
    var chars = 'ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789';
    var s = '';
    for (var i = 0; i < 20; i++) s += chars.charAt(Math.floor(Math.random() * chars.length));
    return s;
  }
  function toFields(obj){
    var f = {};
    Object.keys(obj).forEach(function(k){
      var v = obj[k];
      if (v === null || v === undefined) f[k] = {nullValue: null};
      else if (typeof v === 'boolean') f[k] = {booleanValue: v};
      else if (typeof v === 'number') f[k] = Number.isInteger(v) ? {integerValue: String(v)} : {doubleValue: v};
      else f[k] = {stringValue: String(v)};
    });
    return f;
  }
  function fromFields(fields){
    var o = {};
    Object.keys(fields || {}).forEach(function(k){
      var v = fields[k] || {};
      if ('booleanValue' in v) o[k] = v.booleanValue;
      else if ('integerValue' in v) o[k] = parseInt(v.integerValue, 10);
      else if ('doubleValue' in v) o[k] = v.doubleValue;
      else if ('stringValue' in v) o[k] = v.stringValue;
      else o[k] = null;
    });
    return o;
  }
  function fsFetch(path, opts, ms){
    var ctrl = (typeof AbortController !== 'undefined') ? new AbortController() : null;
    var t = ctrl && setTimeout(function(){ ctrl.abort(); }, ms || 8000);
    var sep = path.indexOf('?') >= 0 ? '&' : '?';
    var url = API_BASE + path + sep + 'key=' + encodeURIComponent(API_KEY);
    var o = Object.assign({}, opts || {});
    if (ctrl) o.signal = ctrl.signal;
    return fetch(url, o).then(function(res){
      if (t) clearTimeout(t);
      if (!res.ok){
        var code = res.status === 403 ? 'permission-denied' : res.status === 404 ? 'not-found' : res.status === 429 ? 'resource-exhausted' : 'error';
        return res.text().then(function(){ var err = new Error('fs'); err.code = code; throw err; });
      }
      return res.status === 204 ? null : res.json();
    }, function(e){
      if (t) clearTimeout(t);
      var err = new Error('fs'); err.code = (e && e.name === 'AbortError') ? 'timeout' : 'network'; throw err;
    });
  }

  /* ---------- scrittura dati ---------- */
  async function onWriteError(e, id){
    if (e && e.code === 'not-found'){
      toast('Questo prodotto è stato tolto da un altro dispositivo');
    } else if (e && e.code === 'permission-denied'){
      writable = false; status = 'lettura'; render();
      toast('Non hai il permesso di modificare la lista');
    } else if (e && e.code === 'resource-exhausted'){
      toast('Archivio pieno: elimina qualche prodotto');
    } else {
      toast('Non sono riuscito a salvare. Riprova.');
    }
  }
  function save(id, patch){
    var it = items.find(function(x){ return x.id === id; });
    if (it) Object.assign(it, patch);
    render();
    if (local) return Promise.resolve();
    var run = function(){
      var qs = Object.keys(patch).map(function(k){ return 'updateMask.fieldPaths=' + encodeURIComponent(k); }).join('&');
      return fsFetch('/prodotti/' + id + '?' + qs, {method:'PATCH', headers:{'Content-Type':'application/json'}, body: JSON.stringify({fields: toFields(patch)})})
        .catch(function(err){ return onWriteError(err, id); });
    };
    queues[id] = (queues[id] || Promise.resolve()).then(run);
    return queues[id];
  }
  async function create(data){
    if (local){
      items.push(Object.assign({id: 'l' + Date.now() + Math.random().toString(36).slice(2,6)}, data));
      return true;
    }
    try {
      await fsFetch('/prodotti?documentId=' + genId(), {method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({fields: toFields(data)})}, 8000);
      return true;
    } catch(e){ await onWriteError(e, null); return false; }
  }
  async function remove(item){
    if (local){ items = items.filter(function(x){ return x.id !== item.id; }); render(); return; }
    items = items.filter(function(x){ return x.id !== item.id; });
    render();
    try { await fsFetch('/prodotti/' + item.id, {method:'DELETE'}, 8000); } catch(e){ await onWriteError(e, item.id); }
  }

  /* ---------- azioni ---------- */
  function maiusc(t){ return t ? t.charAt(0).toUpperCase() + t.slice(1) : t; }
  function esiste(negozio, nome, escludiId){
    return items.some(function(i){ return i.id !== escludiId && i.negozio === negozio && i.nome.toLowerCase() === nome.toLowerCase(); });
  }
  async function importaBatch(righe){
    var toAdd = [];
    for (var s of NEGOZI){
      if (!sel.has(s)) continue;
      var visti = new Set();
      for (var nome of righe){
        var k = nome.toLowerCase();
        if (visti.has(k) || esiste(s, nome)) continue;
        visti.add(k);
        toAdd.push({nome: nome, negozio: s, inLista: false, preso: false, prezzo: null, creato: Date.now()});
      }
    }
    if (!toAdd.length) return {fatti:0, falliti:0};
    var CH = 300, fatti = 0, falliti = 0;
    for (var i = 0; i < toAdd.length; i += CH){
      var chunk = toAdd.slice(i, i + CH);
      var writes = chunk.map(function(data){
        return {update: {name: 'projects/' + PROJECT_ID + '/databases/(default)/documents/prodotti/' + genId(), fields: toFields(data)}};
      });
      try {
        await fsFetch(':commit', {method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({writes: writes})}, 25000);
        fatti += chunk.length;
      } catch(e){ falliti += chunk.length; }
    }
    return {fatti: fatti, falliti: falliti};
  }
  async function importa(){
    if (!writable || importing) return;
    var righe = bulkDraft.split(/[\n,;]+/).map(function(t){ return maiusc(t.trim()); }).filter(Boolean);
    if (!righe.length){ toast('Incolla almeno un prodotto'); return; }
    if (!sel.size){ toast('Scegli almeno un negozio'); return; }
    importing = true; render();
    var fatti = 0, falliti = 0;
    if (local || !PROJECT_ID){
      var diSeguito = 0, stop = false;
      for (var s of NEGOZI){
        if (!sel.has(s) || stop) continue;
        var visti = new Set();
        for (var nome of righe){
          var k = nome.toLowerCase();
          if (visti.has(k) || esiste(s, nome)) continue;
          visti.add(k);
          var ok = await create({nome: nome, negozio: s, inLista: false, preso: false, prezzo: null, creato: Date.now()});
          if (!ok){ falliti++; diSeguito++; if (diSeguito >= 3){ stop = true; break; } continue; }
          diSeguito = 0; fatti++;
        }
      }
    } else {
      var r = await importaBatch(righe);
      fatti = r.fatti; falliti = r.falliti;
    }
    importing = false;
    if (falliti && !fatti){ toast('Non sono riuscito a salvare: controlla la connessione e ripeti.'); }
    else if (falliti){ toast('Aggiunti ' + fatti + ' in un gruppo, un altro gruppo non è andato a buon fine. Ripeti per completare.'); }
    else { bulkDraft = ''; toast(fatti ? fatti + (fatti === 1 ? ' prodotto aggiunto' : ' prodotti aggiunti') : 'Erano già tutti in archivio'); }
    render();
  }
  function iniziaRinomina(i){ editId = i.id; editDraft = i.nome; refocusRename = true; render(); }
  function annullaRinomina(){ editId = null; render(); }
  async function salvaRinomina(i){
    var nome = maiusc(editDraft.trim());
    if (!nome){ toast('Scrivi il nome del prodotto'); return; }
    if (nome === i.nome){ editId = null; render(); return; }
    if (esiste(i.negozio, nome, i.id)){ toast('C’è già un prodotto con questo nome in ' + i.negozio); return; }
    editId = null;
    await save(i.id, {nome: nome});
    render();
  }
  async function aggiungi(){
    if (!writable) return;
    var nome = maiusc(draft.trim());
    if (!nome){ toast('Scrivi il nome del prodotto'); return; }
    if (!sel.size){ toast('Scegli almeno un negozio'); return; }
    var nuovi = 0;
    for (var s of NEGOZI){
      if (!sel.has(s)) continue;
      if (esiste(s, nome)) continue;
      await create({nome: nome, negozio: s, inLista: false, preso: false, prezzo: null, creato: Date.now()});
      nuovi++;
    }
    if (!nuovi) toast('C’è già in archivio');
    draft = ''; refocusName = true; render();
  }
  function parsePrezzo(s){
    s = String(s).replace(/€/g,'').replace(/\s/g,'').replace(',', '.');
    if (!s) return null;
    var n = parseFloat(s);
    if (!isFinite(n) || n < 0) return NaN;
    return Math.round(n * 100) / 100;
  }
  async function concludi(){
    confermaFine = false;
    var presi = items.filter(function(i){ return i.inLista && i.preso; });
    for (var i of presi){ await save(i.id, {inLista:false, preso:false, prezzo:null}); }
    toast('Spesa conclusa');
    render();
  }
  async function svuotaArchivio(){
    if (!writable || svuotando) return;
    svuotando = true; confSvuota = 0; render();
    var tutti = items.slice();
    for (var i of tutti){ await remove(i); }
    svuotando = false;
    toast('Archivio svuotato');
    render();
  }

  /* ---------- viste ---------- */
  function header(){
    var txt = {
      connessione: 'Mi collego…',
      ok: 'Lista condivisa, si salva da sola',
      lettura: 'Sola lettura: puoi guardare ma non modificare',
      locale: 'Dati non salvati: apri la pagina da Claude',
      setup: 'Manca ancora la configurazione Firebase nel file',
      errore: 'Problema di connessione'
    }[status] || '';
    var warn = status !== 'ok' && status !== 'connessione';
    return h('header', {class:'top'},
      h('h1', null, 'La nostra spesa'),
      h('div', {class:'sync' + (warn ? ' warn' : '')}, h('span', {class:'dot'}), txt)
    );
  }

  function rowSpesa(i){
    var ro = !writable;
    return h('div', {class:'row' + (i.preso ? ' done' : '')},
      h('button', {class:'check', type:'button', 'aria-pressed': i.preso ? 'true' : 'false', 'aria-label':'Segna come preso: ' + i.nome, disabled: ro,
        onclick:function(){ save(i.id, {preso: !i.preso}); }}, svg(ICON_CHECK)),
      h('span', {class:'nome'}, i.nome),
      h('label', {class:'prezzo'},
        h('span', null, '€'),
        h('input', {type:'text', inputmode:'decimal', placeholder:'0,00', 'aria-label':'Prezzo di ' + i.nome, disabled: ro,
          value: i.prezzo !== null ? i.prezzo.toFixed(2).replace('.', ',') : '',
          onchange:function(e){
            var v = parsePrezzo(e.target.value);
            if (Number.isNaN(v)){ toast('Scrivi il prezzo in numeri, per esempio 2,50'); render(); return; }
            var patch = {prezzo: v};
            if (v > 0 && !i.preso) patch.preso = true;
            save(i.id, patch);
          },
          onkeydown:function(e){ if (e.key === 'Enter'){ e.target.blur(); } }})
      )
    );
  }

  function viewSpesa(){
    var lista = items.filter(function(i){ return i.inLista; });
    var box = h('div', {class:'stack'});
    if (!lista.length){
      box.append(h('div', {class:'vuoto'},
        h('p', {class:'titolo'}, 'Nessuna spesa in programma'),
        h('p', null, 'Vai nell’Archivio e tocca i prodotti che ti servono: compariranno qui, divisi per negozio.'),
        h('button', {class:'btn', type:'button', onclick:function(){ tab = 'archivio'; render(); window.scrollTo(0,0); }}, 'Apri l’archivio')
      ));
      return box;
    }
    box.append(h('div', {class:'btn-row'},
      h('button', {class:'btn soft sm', type:'button', onclick:function(){ ordinaCategoria = !ordinaCategoria; render(); }},
        ordinaCategoria ? 'Torna all’ordine alfabetico' : 'Ordina per categoria')
    ));
    NEGOZI.forEach(function(s){
      var g = lista.filter(function(i){ return i.negozio === s; });
      if (!g.length) return;
      var presi = g.filter(function(i){ return i.preso; });
      var sub = sum(presi);
      var righe;
      if (ordinaCategoria){
        g = g.slice().sort(byCategoria);
        righe = [];
        var catPrec = null;
        g.forEach(function(i){
          var c = categoria(i.nome);
          if (c !== catPrec){ righe.push(h('div', {class:'cat-sub'}, c)); catPrec = c; }
          righe.push(rowSpesa(i));
        });
      } else {
        g = g.slice().sort(byNome);
        righe = g.map(rowSpesa);
      }
      box.append(h('section', {class:'card ' + CLS[s]},
        h('header', {class:'card-h'},
          h('h2', null, s),
          h('span', {class:'meta'}, h('span', null, presi.length + ' di ' + g.length), sub > 0 ? h('b', null, fmt(sub)) : null)
        ),
        righe
      ));
    });
    var nPresi = lista.filter(function(i){ return i.preso; }).length;
    if (nPresi && writable){
      if (!confermaFine){
        box.append(h('div', {class:'fine'},
          h('button', {class:'btn soft', type:'button', onclick:function(){ confermaFine = true; render(); }}, 'Concludi la spesa'),
          h('p', null, 'Toglie dalla lista i prodotti presi. Quelli che non hai spuntato restano.')
        ));
      } else {
        box.append(h('div', {class:'fine'},
          h('p', null, 'Tolgo dalla lista ' + nPresi + (nPresi === 1 ? ' prodotto preso' : ' prodotti presi') + '. Va bene?'),
          h('div', {class:'btn-row'},
            h('button', {class:'btn', type:'button', onclick:concludi}, 'Sì, concludi'),
            h('button', {class:'btn soft', type:'button', onclick:function(){ confermaFine = false; render(); }}, 'Annulla')
          )
        ));
      }
    }
    return box;
  }

  function rowArchivio(i){
    var ro = !writable;
    if (editId === i.id){
      return h('div', {class:'row edit'},
        h('input', {id:'rinomina', class:'campo', type:'text', autocomplete:'off', enterkeyhint:'done', 'aria-label':'Nuovo nome di ' + i.nome, value: editDraft,
          oninput:function(e){ editDraft = e.target.value; },
          onkeydown:function(e){
            if (e.key === 'Enter'){ e.preventDefault(); salvaRinomina(i); }
            else if (e.key === 'Escape'){ annullaRinomina(); }
          }}),
        h('div', {class:'btn-row'},
          h('button', {class:'btn sm', type:'button', onclick:function(){ salvaRinomina(i); }}, 'Salva il nome'),
          h('button', {class:'btn soft sm', type:'button', onclick:annullaRinomina}, 'Annulla')
        )
      );
    }
    return h('div', {class:'row' + (i.inLista ? ' on' : '')},
      h('button', {class:'pick', type:'button', 'aria-pressed': i.inLista ? 'true' : 'false', disabled: ro,
        onclick:function(){ save(i.id, {inLista: !i.inLista, preso:false, prezzo:null}); }},
        h('span', {class:'nome'}, i.nome),
        h('span', {class:'stato'}, i.inLista ? [svg(ICON_CHECK), 'In lista'] : 'Aggiungi')
      ),
      h('button', {class:'trash edit', type:'button', 'aria-label':'Cambia nome a ' + i.nome, disabled: ro,
        onclick:function(){ iniziaRinomina(i); }}, svg(ICON_EDIT)),
      h('button', {class:'trash', type:'button', 'aria-label':'Elimina ' + i.nome, disabled: ro,
        onclick:function(){ remove(i); }}, svg(ICON_TRASH))
    );
  }

  function viewArchivio(){
    var ro = !writable;
    var box = h('div', {class:'stack'});
    box.append(h('section', {class:'card aggiungi'},
      h('h2', null, 'Nuovo prodotto'),
      h('input', {id:'nome', class:'campo', type:'text', placeholder:'Per esempio latte, dentifricio', autocomplete:'off', enterkeyhint:'done',
        'aria-label':'Nome del prodotto', disabled: ro, value: draft,
        oninput:function(e){ draft = e.target.value; },
        onkeydown:function(e){ if (e.key === 'Enter'){ e.preventDefault(); aggiungi(); } }}),
      h('div', {class:'chips', role:'group', 'aria-label':'Dove lo compri'},
        NEGOZI.map(function(s){
          return h('button', {type:'button', class:'chip ' + CLS[s] + (sel.has(s) ? ' on' : ''), 'aria-pressed': sel.has(s) ? 'true' : 'false', disabled: ro,
            onclick:function(){ if (sel.has(s)) sel.delete(s); else sel.add(s); render(); }}, s);
        })
      ),
      h('button', {class:'btn', type:'button', disabled: ro, onclick:aggiungi}, 'Aggiungi all’archivio')
    ));
    box.append(h('section', {class:'card aggiungi'},
      h('h2', null, 'Tanti prodotti insieme'),
      h('p', {class:'hint'}, 'Incolla o detta la lista, un prodotto per riga (vanno bene anche le virgole). Finiscono nei negozi scelti sopra.'),
      h('textarea', {class:'campo', rows:'5', 'aria-label':'Lista di prodotti', placeholder:'Latte\nPane\nPasta', disabled: ro || importing,
        oninput:function(e){ bulkDraft = e.target.value; }}, bulkDraft),
      h('button', {class:'btn', type:'button', disabled: ro || importing, onclick:importa}, importing ? 'Sto aggiungendo…' : 'Aggiungi tutti')
    ));
    if (!items.length){
      box.append(h('div', {class:'vuoto'},
        h('p', {class:'titolo'}, 'L’archivio è vuoto'),
        h('p', null, 'Scrivi un prodotto qui sopra e scegli in quali negozi lo compri. Poi ti basta un tocco per metterlo nella spesa.')
      ));
      return box;
    }
    if (items.length){
      box.append(h('div', {class:'btn-row'},
        h('button', {class:'btn soft sm', type:'button', onclick:function(){ ordinaCategoria = !ordinaCategoria; render(); }},
          ordinaCategoria ? 'Torna all’ordine alfabetico' : 'Ordina per categoria')
      ));
    }
    NEGOZI.forEach(function(s){
      var g = items.filter(function(i){ return i.negozio === s; });
      if (!g.length) return;
      var righe;
      if (ordinaCategoria){
        g = g.slice().sort(byCategoria);
        righe = [];
        var catPrec = null;
        g.forEach(function(i){
          var c = categoria(i.nome);
          if (c !== catPrec){ righe.push(h('div', {class:'cat-sub'}, c)); catPrec = c; }
          righe.push(rowArchivio(i));
        });
      } else {
        g = g.slice().sort(byNome);
        righe = g.map(rowArchivio);
      }
      box.append(h('section', {class:'card ' + CLS[s]},
        h('header', {class:'card-h'}, h('h2', null, s), h('span', {class:'meta'}, g.length + (g.length === 1 ? ' prodotto' : ' prodotti'))),
        righe
      ));
    });
    if (writable){
      if (confSvuota === 0){
        box.append(h('div', {class:'fine'},
          h('button', {class:'btn soft', type:'button', disabled: svuotando, onclick:function(){ confSvuota = 1; render(); }}, 'Svuota l’archivio')
        ));
      } else if (confSvuota === 1){
        box.append(h('div', {class:'fine'},
          h('p', null, 'Vuoi eliminare tutti i ' + items.length + (items.length === 1 ? ' prodotto' : ' prodotti') + ' dall’archivio, in tutti i negozi?'),
          h('div', {class:'btn-row'},
            h('button', {class:'trash sure', type:'button', onclick:function(){ confSvuota = 2; render(); }}, 'Sì, continua'),
            h('button', {class:'btn soft', type:'button', onclick:function(){ confSvuota = 0; render(); }}, 'Annulla')
          )
        ));
      } else {
        box.append(h('div', {class:'fine'},
          h('p', null, 'Sicuro? Non si può annullare: la lista e l’archivio si svuotano per te e per lei.'),
          h('div', {class:'btn-row'},
            h('button', {class:'trash sure', type:'button', disabled: svuotando, onclick:svuotaArchivio}, svuotando ? 'Sto eliminando…' : 'Sì, elimina tutto'),
            h('button', {class:'btn soft', type:'button', disabled: svuotando, onclick:function(){ confSvuota = 0; render(); }}, 'Annulla')
          )
        ));
      }
    }
    return box;
  }

  function tabBtn(id, label){
    return h('button', {class:'tab', type:'button', role:'tab', 'aria-selected': tab === id ? 'true' : 'false',
      onclick:function(){ tab = id; confermaFine = false; confSvuota = 0; render(); window.scrollTo(0,0); }}, label);
  }
  function dockContent(){
    var out = [];
    var lista = items.filter(function(i){ return i.inLista; });
    if (tab === 'spesa' && lista.length){
      var presi = lista.filter(function(i){ return i.preso; });
      out.push(h('div', {class:'totale', role:'status'},
        h('div', null, h('div', {class:'t-label'}, 'Speso finora'), h('div', {class:'t-sub'}, presi.length + ' presi su ' + lista.length)),
        h('div', {class:'num'}, fmt(sum(presi)))
      ));
    }
    out.push(h('nav', {class:'tabs', role:'tablist', 'aria-label':'Sezioni'},
      tabBtn('spesa', 'Spesa' + (lista.length ? ' (' + lista.length + ')' : '')),
      tabBtn('archivio', 'Archivio')
    ));
    return out;
  }

  function render(){
    dirty = false;
    var body;
    if (status === 'setup'){
      body = h('div', {class:'vuoto'},
        h('p', null, 'Prima di usarla, apri questo file e incolla la tua configurazione Firebase al posto di "INCOLLA_QUI", poi ricarica la pagina.'));
    } else if (!loaded && !local){
      body = h('div', {class:'vuoto'}, h('p', null, 'Sto caricando la vostra lista…'));
    } else {
      body = tab === 'spesa' ? viewSpesa() : viewArchivio();
    }
    app.replaceChildren(header(), body);
    dock.replaceChildren.apply(dock, dockContent());
    if (refocusRename){
      var r = document.getElementById('rinomina');
      if (r){ r.focus(); r.select(); }
      refocusRename = false;
    }
    if (refocusName){
      var n = document.getElementById('nome');
      if (n) n.focus();
      refocusName = false;
    }
  }
  function inputFocused(){
    var a = document.activeElement;
    return !!(a && (a.tagName === 'INPUT' || a.tagName === 'TEXTAREA') && app.contains(a));
  }
  function scheduleRender(){
    if (inputFocused()) dirty = true; else render();
  }
  app.addEventListener('focusout', function(){
    if (!dirty) return;
    setTimeout(function(){ if (dirty && !inputFocused()) render(); }, 250);
  });

  /* ---------- avvio ---------- */
  async function caricaTutto(){
    try {
      var data = await fsFetch('/prodotti?pageSize=1000', {method:'GET'}, 10000);
      var docs = (data && data.documents) || [];
      items = docs.map(function(d){
        var id = d.name.split('/').pop();
        var v = fromFields(d.fields);
        return {id:id, nome:String(v.nome || ''), negozio:v.negozio, inLista:!!v.inLista, preso:!!v.preso,
                prezzo: typeof v.prezzo === 'number' ? v.prezzo : null};
      }).filter(function(i){ return i.nome && NEGOZI.indexOf(i.negozio) !== -1; });
      loaded = true;
      if (status === 'connessione' || status === 'errore') status = 'ok';
      scheduleRender();
    } catch(e){
      if (e && e.code === 'permission-denied'){ writable = false; status = 'lettura'; }
      else if (!loaded){ status = 'errore'; }
      loaded = true; render();
    }
  }
  async function init(){
    render();
    if (!firebaseConfig || firebaseConfig.apiKey === 'INCOLLA_QUI'){
      status = 'setup'; loaded = true; render(); return;
    }
    PROJECT_ID = firebaseConfig.projectId;
    API_KEY = firebaseConfig.apiKey;
    API_BASE = 'https://firestore.googleapis.com/v1/projects/' + PROJECT_ID + '/databases/(default)/documents';
    await caricaTutto();
    if (pollTimer) clearInterval(pollTimer);
    pollTimer = setInterval(caricaTutto, 4000);
  }
  init();
})();
</script>
</body>
</html>
